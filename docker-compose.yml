version: '3.8'

services:

  app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: node-app
    ports: 
      - 3000:3000
    volumes:
      - ./:/home/app/
    networks:
      - app-network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - auth_volume_db:/var/lib/postgresql/data
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:16.1.1
    environment:
      DB_VENDOR: postgres
      DB_ADDR: postgres
      DB_PASSWORD: keycloak
      #KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL}
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: 4321
      PROXY_ADDRESS_FORWARDING: "true"
      CACHE_OWNERS_COUNT: 3
      CACHE_OWNERS_AUTH_SESSIONS_COUNT: 3
      JGROUPS_DISCOVERY_PROTOCOL: JDBC_PING
      JGROUPS_DISCOVERY_PROPERTIES: "datasource_jndi_name=java:jboss/datasources/KeycloakDS,initialize_sql=\"CREATE TABLE IF NOT EXISTS JGROUPSPING (own_addr varchar(200) NOT NULL, cluster_name varchar(200) NOT NULL, created TIMESTAMP DEFAULT CURRENT_TIMESTAMP, ping_data BYTEA, constraint PK_JGROUPSPING PRIMARY KEY (own_addr, cluster_name))\",remove_all_data_on_view_change=true"
    depends_on:
      - postgres
    ports:
      - 8080:8080
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  auth_volume_db: {}
